<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IN Curator Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .curator-gradient { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        /* Thumbnail lebih besar */
        .thumb-img { width: 120px; height: 120px; object-fit: cover; border-radius: 0.75rem; background-color: #f3f4f6; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 min-h-screen flex flex-col">

    <header class="curator-gradient text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-red-600 flex items-center justify-center shadow-lg border border-gray-700">
                <i class="fa-solid fa-layer-group text-white"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wide">Workspace Kurator</h1>
                <p class="text-xs text-gray-400 font-medium">Manajemen Antrean POTD Instanusantara</p>
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-4xl">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 mb-8">
            <form id="add-form" class="flex gap-3">
                <input type="text" id="ig-url-input" required
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 text-sm"
                    placeholder="Paste URL Instagram...">
                <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-medium px-6 rounded-lg transition-colors shadow">
                    Tambah
                </button>
            </form>
        </div>

        <div id="curation-list" class="space-y-4">
            <!-- Items -->
        </div>
    </main>

    <script>
        let curationData = JSON.parse(localStorage.getItem('in_curation_data')) || [];
        const listContainer = document.getElementById('curation-list');

        function renderList() {
            listContainer.innerHTML = curationData.length === 0 ? '<p class="text-center text-gray-400 py-10">Belum ada antrean.</p>' : '';
            curationData.forEach(item => {
                const itemHTML = `
                    <div class="bg-white rounded-xl p-4 border border-gray-200 shadow-sm flex gap-4 fade-in">
                        <img src="${item.thumb}" class="thumb-img border border-gray-100" onerror="this.src='https://placehold.co/120x120/eeeeee/999999?text=IMG'">
                        <div class="flex-grow flex flex-col justify-between">
                            <a href="${item.url}" target="_blank" class="text-sm font-bold text-blue-600 truncate">${item.url}</a>
                            <input type="text" placeholder="Catatan..." class="w-full text-xs p-2 bg-gray-50 rounded border" onchange="updateNote('${item.id}', this.value)" value="${item.note || ''}">
                            <div class="flex gap-2">
                                <button onclick="deleteItem('${item.id}')" class="text-red-500 text-xs px-3 py-1 bg-red-50 rounded hover:bg-red-100">Hapus</button>
                            </div>
                        </div>
                    </div>
                `;
                listContainer.insertAdjacentHTML('beforeend', itemHTML);
            });
        }

        document.getElementById('add-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = document.getElementById('ig-url-input').value.trim();
            let thumb = 'https://placehold.co/120x120/eeeeee/999999?text=IG';
            try {
                const res = await fetch(`https://api.microlink.io/?url=${encodeURIComponent(url)}`);
                const data = await res.json();
                if(data.data.image) thumb = data.data.image.url;
            } catch(e) {}
            curationData.unshift({ id: Date.now().toString(), url, thumb, note: '' });
            localStorage.setItem('in_curation_data', JSON.stringify(curationData));
            document.getElementById('ig-url-input').value = '';
            renderList();
        });

        function updateNote(id, val) { curationData.find(i => i.id === id).note = val; localStorage.setItem('in_curation_data', JSON.stringify(curationData)); }
        function deleteItem(id) { curationData = curationData.filter(i => i.id !== id); localStorage.setItem('in_curation_data', JSON.stringify(curationData)); renderList(); }
        renderList();
    </script>
</body>
</html>
