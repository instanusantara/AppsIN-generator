<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IN IG Downloader - Redirect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .btn-gradient { background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-xl text-center">
        <div class="animate-bounce mb-4 text-4xl">🚀</div>
        <h1 class="text-xl font-bold text-gray-800 mb-2">Mengalihkan ke FastDL...</h1>
        <p class="text-gray-500 text-sm mb-6">Anda akan diarahkan ke FastDL untuk memproses unduhan secara otomatis.</p>
        
        <a id="redirect-link" href="#" class="btn-gradient text-white font-bold py-3 px-6 rounded-xl hover:opacity-90 transition-all">
            Klik di sini jika tidak otomatis pindah
        </a>
    </div>

    <footer class="absolute bottom-6 text-gray-400 text-xs">
        <p>© 2026 Instanusantara - Tools Internal Redaksi</p>
    </footer>

    <script>
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const autoUrl = params.get('auto_url');
            
            // Jika ada link, arahkan ke FastDL dengan parameter link tersebut
            if (autoUrl) {
                // Membersihkan link (buang tracking)
                const cleanUrl = autoUrl.split('?')[0];
                const fastDlUrl = `https://fastdl.app/id/process?url=${encodeURIComponent(cleanUrl)}`;
                
                document.getElementById('redirect-link').href = fastDlUrl;
                window.location.href = fastDlUrl;
            } else {
                // Jika tidak ada link, arahkan ke halaman utama FastDL
                window.location.href = "https://fastdl.app/id";
            }
        };
    </script>
</body>
</html>
