<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IN IG Downloader - Fast Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .input-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        .btn-gradient { background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-2xl text-center">
            <!-- Header -->
            <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-800 mb-2">Instagram Downloader</h1>
            <p class="text-gray-500 mb-8">Download Foto, Video, Reels & Carousel dengan Cepat.</p>

            <!-- Input Form ala FastDL -->
            <div class="bg-white p-2 rounded-2xl input-shadow mb-6 border border-gray-100">
                <form id="download-form" class="flex flex-col sm:flex-row gap-2">
                    <input type="text" id="ig-url" required
                        class="flex-grow px-6 py-4 rounded-xl bg-gray-50 text-gray-700 outline-none focus:ring-2 focus:ring-red-400"
                        placeholder="Paste link Instagram di sini...">
                    <button type="submit" id="submit-btn"
                        class="btn-gradient text-white font-bold py-4 px-8 rounded-xl hover:opacity-90 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-download"></i> Download
                    </button>
                </form>
            </div>

            <!-- Loading & Error Area -->
            <div id="loading-state" class="hidden py-8">
                <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-red-500 mx-auto mb-4"></div>
                <p class="text-gray-500 font-medium">Sedang memproses link...</p>
            </div>

            <div id="error-box" class="hidden bg-red-50 text-red-600 p-4 rounded-xl border border-red-200 mb-6 text-sm">
                <p id="error-message"></p>
                <a href="https://snapinsta.app/" target="_blank" class="block mt-2 font-bold underline">Coba Web Alternatif (SnapInsta)</a>
            </div>

            <!-- Results -->
            <div id="results-container" class="hidden grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Media hasil akan muncul di sini -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-gray-400 text-sm">
        <p>© 2026 Instanusantara - Tools Internal Redaksi</p>
    </footer>

    <script>
        const form = document.getElementById('download-form');
        const inputUrl = document.getElementById('ig-url');
        const loadingState = document.getElementById('loading-state');
        const errorBox = document.getElementById('error-box');
        const resultsContainer = document.getElementById('results-container');

        // Auto-fetch jika ada parameter di URL
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const autoUrl = params.get('auto_url');
            if (autoUrl) {
                inputUrl.value = autoUrl;
                form.dispatchEvent(new Event('submit'));
            }
        };

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const rawUrl = inputUrl.value.trim().split('?')[0];
            
            errorBox.classList.add('hidden');
            resultsContainer.classList.add('hidden');
            loadingState.classList.remove('hidden');

            try {
                const response = await fetch(`https://co.wuk.sh/api/json`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: rawUrl, isNoTTWatermark: true })
                });
                
                const data = await response.json();
                if (data.status === 'error') throw new Error(data.text);

                resultsContainer.innerHTML = '';
                const items = data.picker || [data];
                
                items.forEach(item => {
                    resultsContainer.innerHTML += `
                        <div class="bg-white p-3 rounded-xl shadow border border-gray-100">
                            <img src="${item.thumb || item.url}" class="w-full h-48 object-cover rounded-lg mb-3">
                            <a href="${item.url}" download class="block w-full bg-red-600 text-white py-2 rounded-lg text-sm font-bold text-center">Unduh File</a>
                        </div>
                    `;
                });
                
                loadingState.classList.add('hidden');
                resultsContainer.classList.remove('hidden');
            } catch (err) {
                loadingState.classList.add('hidden');
                errorBox.classList.remove('hidden');
                document.getElementById('error-message').textContent = "Gagal memproses: " + err.message;
            }
        });
    </script>
</body>
</html>
